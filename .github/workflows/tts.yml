name: TTS voice build
on:
  workflow_dispatch:
    inputs:
      voice:
        description: alice | brian
        default: alice
      mode:
        description: check | generate | fix
        default: check
      ref:
        description: (fix) 구절 주소 예) 출 19:5-6
        default: ''
      expect:
        description: (fix) 반드시 들려야 하는 말
        default: ''
      reject:
        description: (fix) 들리면 안 되는 말
        default: ''
  schedule:
    - cron: '0 1 1 12 *'   # 12월 1일 10:00 KST — Brian 전체 생성
permissions:
  contents: read
  id-token: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/792068515925/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: gh-deploy@verse-sheet.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save @google-cloud/firestore@7
      - name: Run
        env:
          VOICE_IN: ${{ github.event.inputs.voice || 'brian' }}
          MODE_IN: ${{ github.event.inputs.mode || 'generate' }}
          REF_IN: ${{ github.event.inputs.ref }}
          EXPECT_IN: ${{ github.event.inputs.expect }}
          REJECT_IN: ${{ github.event.inputs.reject }}
        run: |
          case "$VOICE_IN" in
            alice) ID=Xb7hH8MSUJpSbSDYk0k2; NAME="Alice (여성)";;
            brian) ID=nPczCjzI2devNBz1zQrb; NAME="Brian (남성)";;
            *) echo "unknown voice $VOICE_IN"; exit 2;;
          esac
          # 예약 실행(크레딧 초기화 직후): 밀린 음성 수정부터 처리한 뒤 Brian 생성
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node -e "const l=require('./scripts/tts-fixlist.json');const ids={alice:'Xb7hH8MSUJpSbSDYk0k2',brian:'nPczCjzI2devNBz1zQrb'};const {spawnSync}=require('child_process');for(const f of l){const r=spawnSync('node',['scripts/tts-fix.mjs','--voice',ids[f.voice],'--ref',f.ref,'--expect',f.expect||'','--reject',f.reject||''],{stdio:'inherit'});console.log('FIX '+f.ref+' exit='+r.status);}"
          fi
          if [ "$MODE_IN" = "fix" ]; then node scripts/tts-fix.mjs --voice "$ID" --ref "$REF_IN" --expect "$EXPECT_IN" --reject "$REJECT_IN"; exit $?; fi
          if [ "$MODE_IN" = "check" ]; then node scripts/tts-gen.mjs --voice "$ID" --name "$NAME" --check; else node scripts/tts-gen.mjs --voice "$ID" --name "$NAME"; fi
