name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/792068515925/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: gh-deploy@verse-sheet.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g firebase-tools@13
      - run: firebase deploy --only hosting,firestore:rules --project verse-sheet --non-interactive
      - name: Verify live build matches repo (retry up to 2 min)
        run: |
          V=$(grep -o 'name="app-build" content="v[0-9]*"' index.html | grep -o 'v[0-9]*')
          for i in $(seq 1 12); do
            L=$(curl -s "https://verse-sheet.firebaseapp.com/?r=$RANDOM$i" | grep -o 'name="app-build" content="v[0-9]*"' | grep -o 'v[0-9]*')
            echo "try $i: repo=$V live=$L"; [ "$V" = "$L" ] && exit 0; sleep 10
          done; exit 1
