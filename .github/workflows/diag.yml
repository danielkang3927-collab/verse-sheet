name: TTS diagnose
on:
  workflow_dispatch:
    inputs:
      voice:
        description: alice | brian
        default: alice
      ref:
        description: 구절 주소(비우면 전체 경계 점검)
        default: ''
      audit:
        description: yes=전 구절 받아쓰기 점검 / alfill=시각표 없는 음성에 시각표 만들어 넣기
        default: 'no'
permissions:
  contents: read
  id-token: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/792068515925/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: gh-deploy@verse-sheet.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save @google-cloud/firestore@7 playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Diagnose
        env:
          VOICE_IN: ${{ github.event.inputs.voice }}
          REF_IN: ${{ github.event.inputs.ref }}
        run: |
          case "$VOICE_IN" in alice) ID=Xb7hH8MSUJpSbSDYk0k2;; brian) ID=nPczCjzI2devNBz1zQrb;; *) exit 2;; esac
          if [ -n "$REF_IN" ]; then node scripts/tts-diag.mjs --voice "$ID" --ref "$REF_IN"; elif [ "${{ github.event.inputs.audit }}" = "alfill" ]; then node scripts/tts-diag.mjs --voice "$ID" --saveall --onlynoal; elif [ "${{ github.event.inputs.audit }}" = "yes" ]; then node scripts/tts-diag.mjs --voice "$ID" --saveall; else node scripts/tts-diag.mjs --voice "$ID"; fi
      - name: 받아쓰기(구절 지정 시)
        if: ${{ github.event.inputs.ref != '' }}
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q faster-whisper numpy
          python scripts/stt.py medium
      - name: 전 구절 받아쓰기 점검
        if: ${{ github.event.inputs.audit == 'yes' && github.event.inputs.ref == '' }}
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q faster-whisper numpy
          python scripts/stt_all.py medium
      - name: 시각표 없는 음성에 시각표 만들어 넣기
        if: ${{ github.event.inputs.audit == 'alfill' && github.event.inputs.ref == '' }}
        env:
          VOICE_IN: ${{ github.event.inputs.voice }}
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q faster-whisper numpy
          python scripts/stt_align.py
          node scripts/al-write.mjs
          case "$VOICE_IN" in alice) ID=Xb7hH8MSUJpSbSDYk0k2;; brian) ID=nPczCjzI2devNBz1zQrb;; esac
          node scripts/tts-diag.mjs --voice "$ID"
